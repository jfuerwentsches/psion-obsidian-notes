stages:
  - test

default:
  image: python:3.11-slim

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  OPOLUA_REV: "6bb10d5b60ce94abea20b9e1f0abb61d33218649"

python-tests:
  stage: test
  script:
    - python -m pip install -e '.[dev]'
    - python -m pytest --ignore=tests/test_app.py --junitxml=python-results.xml
  artifacts:
    when: always
    reports:
      junit: python-results.xml

opl-tests:
  stage: test
  variables:
    REQUIRE_OPL_TESTS: "1"
    LUA: lua5.4
    OPOLUA_DIR: /tmp/psivault-opolua
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates lua5.4
    - git init "$OPOLUA_DIR"
    - git -C "$OPOLUA_DIR" remote add origin https://github.com/inseven/opolua.git
    - git -C "$OPOLUA_DIR" fetch --depth=1 origin "$OPOLUA_REV"
    - git -C "$OPOLUA_DIR" checkout --detach FETCH_HEAD
    - python -m pip install -e '.[dev]'
  script:
    - python -m pytest tests/test_app.py --junitxml=opl-results.xml
  artifacts:
    when: always
    reports:
      junit: opl-results.xml
