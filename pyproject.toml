[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psionsync"
version = "0.1.0"
description = "Two-way sync of an Obsidian vault with a Psion 5mx (C:\\Vault) via plpftp"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
psionsync = "psionsync.cli:main"

[tool.setuptools.packages.find]
include = ["psionsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
